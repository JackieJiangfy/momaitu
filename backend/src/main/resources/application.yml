server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  application:
    name: novel-graph-backend
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher   # Spring Boot 2.7 兼容 Sa-Token 拦截器
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

############## MyBatis-Plus 配置 ##############
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.novelgraph.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发期打印 SQL
  global-config:
    banner: false
    db-config:
      id-type: assign_id          # 主键策略：雪花算法（与 VARCHAR(32) 兼容，应用层生成 ID）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  token-name: Authorization
  timeout: 2592000              # 30 天（秒）
  active-timeout: -1            # 不限制活跃频率
  is-concurrent: true           # 允许同账号多端登录
  is-share: false               # 每次登录生成新 token
  token-style: uuid
  is-log: false

logging:
  level:
    com.novelgraph: debug
    com.baomidou: warn
